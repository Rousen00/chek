<title>Карманный чек</title>

<style>
/* Layout: an iPhone-native stack: deep green balance card, one capture field, inset grouped lists, tab bar under the thumb. */
:root {
  --bg: #f2f3f1; --card: #ffffff; --ink: #14181a; --soft: #6c7572; --hair: #e4e6e2; --accent: #0d7a5f; --on-accent: #ffffff; --tint: #e3f2ed; --warn: #c2492a;

  --ghost: #b7bfbb; --bar: #f8f9f7ee;
  --wall: #e9dcc6; --roof: #c5533a; --wood: #8a5a3a; --glass: #8fc7dc; --grass: #7fb56a; --sun: #f2b63e; --metal: #4c5659; --paint: #d8452f; --road: #5b6366;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", sans-serif;
  --round: ui-rounded, "SF Pro Rounded", -apple-system, Roboto, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c0f0e; --card: #171b1a; --ink: #eef2f0; --soft: #8e9895; --hair: #262c2a; --accent: #4fd0a8; --on-accent: #05130e; --tint: #16322a; --warn: #f0875f;
  --hero: #143a31; --hero-ink: #f3f8f5; --hero-soft: #a9c6bb; --hero-bar: #3f7f6c; --hero-top: #8ee6c4;
  --ghost: #4a5451; --bar: #141817ee; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c0f0e; --card: #171b1a; --ink: #eef2f0; --soft: #8e9895; --hair: #262c2a; --accent: #4fd0a8; --on-accent: #05130e; --tint: #16322a; --warn: #f0875f;
  --hero: #143a31; --hero-ink: #f3f8f5; --hero-soft: #a9c6bb; --hero-bar: #3f7f6c; --hero-top: #8ee6c4;
  --ghost: #4a5451; --bar: #141817ee; color-scheme: dark; }
[hidden] { display: none !important; }
* { -webkit-tap-highlight-color: transparent; }

.num { font-family: var(--round); font-variant-numeric: tabular-nums; }

.reveal { animation: reveal 1.1s ease-out both; }
@keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
.row, .goal { animation: rise .32s ease-out both; }

.credit { color: var(--soft); font-size: 11px; }
.credit a { color: inherit; }
.pick4 { grid-template-columns: repeat(4, 1fr); }
.pick4 button { padding: 0; overflow: hidden; display: grid; min-height: 0; font-size: 12px; border-radius: 13px; }
.pick4 img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
.pick4 span { padding: 6px 2px; }
.ghead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ghead b { font: 700 19px var(--round); overflow-wrap: anywhere; min-width: 0; }
.ghead span { font: 700 19px var(--round); color: var(--accent); }
.gsub { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; color: var(--soft); font-size: 13px; font-variant-numeric: tabular-nums; }
.gadd { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; }
.gadd input { min-width: 0; height: 44px; box-sizing: border-box; border: 0; border-radius: 12px; padding-inline: 12px; background: var(--bg); color: var(--ink); font: 16px var(--font); }

#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; display: flex; justify-content: center; background: var(--bar); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--hair); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 6px) max(8px, env(safe-area-inset-left, 0px)); }
#tabs button { flex: 1; max-width: 140px; min-height: 50px; border: 0; background: none; color: var(--soft); font: 500 11px var(--font); display: grid; justify-items: center; gap: 2px; align-content: center; }
#tabs button[aria-selected="true"] { color: var(--accent); }

.sheet form { width: 100%; max-width: 560px; box-sizing: border-box; background: var(--card); border-radius: 22px 22px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; }
.sheet h2 { margin: 0; font: 700 20px var(--round); }
.sheet label { display: grid; gap: 4px; font-size: 13px; color: var(--soft); }
.sheet input, .sheet select, .sheet textarea { box-sizing: border-box; height: 46px; border: 0; border-radius: 12px; padding-inline: 12px; font: 17px var(--font); background: var(--bg); color: var(--ink); width: 100%; min-width: 0; }
.sheet textarea { height: 110px; padding-block: 10px; font-size: 13px; }
.acts { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.acts button { min-height: 48px; border-radius: 13px; border: 0; background: var(--bg); color: var(--ink); font: 600 15px var(--font); }
.acts .pri { background: var(--accent); color: var(--on-accent); }
.acts .del { color: var(--warn); }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pick button { min-height: 48px; border-radius: 12px; border: 2px solid transparent; background: var(--bg); color: var(--ink); font: 600 15px var(--font); }
.pick button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
#toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 76px); transform: translateX(-50%); width: min(92vw, 520px); box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 14px; z-index: 5; font-size: 15px; }
#toast span { min-width: 0; overflow-wrap: anywhere; }
#toast button { border: 0; background: none; color: inherit; font: 700 14px var(--font); min-height: 36px; flex: none; opacity: .85; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
/* Живая подача: насыщенная карточка баланса, лаймовый акцент и плавающая панель вкладок. */
:root { --lime: #c9f73a; --lime-ink: #10210f; }
#app { padding-block-end: calc(env(safe-area-inset-bottom, 0px) + 112px); }
#hero { position: relative; overflow: hidden; border-radius: 28px; padding: 20px; background: radial-gradient(110% 130% at 100% 0, #27c586 0, transparent 58%), radial-gradient(90% 110% at 0 100%, #0a6f6a 0, transparent 60%), #07332b; box-shadow: 0 14px 30px #07332b40; }
#totalN { font-size: 44px; font-weight: 800; }
#hero small, #heroSub { color: #d3efe3; }
#week i { background: #ffffff40; } #week .now i { background: var(--lime); }
#week div { color: #d3efe3; }
#heroGoal { grid-column: 1 / -1; display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border: 0; border-radius: 16px; background: #ffffff1f; color: #fff; text-align: left; font: 600 14px var(--font); }
#heroGoal img { width: 52px; height: 40px; object-fit: cover; border-radius: 10px; display: block; }
#heroGoal span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#heroGoal b { color: var(--lime); font: 800 16px var(--round); }
#add { border-radius: 22px; }
#send { background: var(--lime); color: var(--lime-ink); }
.group, .empty { border-radius: 22px; }
.goal { border-radius: 26px; }
.ico { border-radius: 13px; box-shadow: inset 0 0 0 1px #ffffff26; }
.amt { font-weight: 700; }
.sec { font-size: 14px; color: var(--ink); }
.sec b { color: var(--soft); }
.gadd .in, .acts .pri { background: var(--lime); color: var(--lime-ink); }
.ghost { background: var(--ink); color: var(--bg); font-weight: 700; }
.bar i, .goal .bar i { background: linear-gradient(90deg, #17a673, var(--lime)); }
#tabs { left: 50%; right: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); transform: translateX(-50%); width: min(calc(100vw - 32px), 460px); box-sizing: border-box; padding: 6px; gap: 2px; border: 0; border-radius: 26px; background: #101a17f2; box-shadow: 0 10px 28px #0000003d; }

<main id="app">
  <section id="hero" aria-label="Траты за месяц">
    <div><small id="monthName">За месяц</small><div id="totalN">0 ₽</div><div id="heroSub"></div></div>
    <div id="week" aria-hidden="true"></div>
    <button id="heroGoal" type="button" hidden><img alt="" id="heroImg"><span id="heroTitle"></span><b id="heroPct"></b></button>
  </section>
  <form id="add" autocomplete="off">
    <input id="say" type="text" enterkeyhint="done" placeholder="Молоко 120" aria-label="Что купили и сколько">
    <button id="mic" type="button" aria-label="Сказать голосом" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button id="send" type="submit" aria-label="Записать"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
  </form>
  <div id="tip">Нажмите на поле и на микрофон клавиатуры. Скажите: «хлеб 60», «план шины 15000» или «в копилку 5000».</div>

</main>

  <button role="tab" data-t="spend" aria-selected="true"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>Траты</button>
  <button role="tab" data-t="plan" aria-selected="false"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>Планы</button>
  <button role="tab" data-t="goal" aria-selected="false"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7M6 9v11h12V9M10 20v-6h4v6"/></svg>Копилка</button>

<div id="sheet" class="sheet" hidden>
  <form id="form">
    <h2>Запись</h2>
    <label>Название <input id="fTitle" type="text"></label>
    <label>Сумма, ₽ <input id="fAmt" type="number" inputmode="decimal" min="0" step="any"></label>
    <label>Категория <select id="fCat"></select></label>

  </form>

    <h2 id="gHead">Новая цель</h2>

  </form>

  </form>

<div id="toast" hidden role="status"><span id="toastT"></span><button id="toastU" type="button">Отменить</button></div>

<script>
// --- Разбор фразы: сумма, тип, категория, дата ---
const NUM = { ноль:0, один:1, одна:1, одну:1, два:2, две:2, три:3, четыре:4, пять:5, шесть:6, семь:7, восемь:8, девять:9, десять:10, одиннадцать:11, двенадцать:12, тринадцать:13, четырнадцать:14, пятнадцать:15, шестнадцать:16, семнадцать:17, восемнадцать:18, девятнадцать:19, двадцать:20, тридцать:30, сорок:40, пятьдесят:50, шестьдесят:60, семьдесят:70, восемьдесят:80, девяносто:90, сто:100, двести:200, триста:300, четыреста:400, пятьсот:500, шестьсот:600, семьсот:700, восемьсот:800, девятьсот:900 };
const THOUS = /^(тысяч[аиу]?|тыс|косар[ьяей]*|штук[аи]?)$/, MILL = /^(миллион(а|ов)?|лям(а|ов)?)$/;
const CUR = /^(руб(л(ь|я|ей))?|р|₽|рублика|рублей)$/, UNIT = /^(кг|кило|г|гр|грамм(а|ов)?|литр(а|ов)?|л|шт|штук|пачк[аиу]|пачек|пакет(а|ов)?|бутыл(ка|ки|ок)|банк[аи]|раз(а)?|дн(я|ей)|день|час(а|ов)?)$/;
const CATS = [
  ['Продукты', /молок|хлеб|сыр|мяс|кур[иа]|яйц|овощ|фрукт|яблок|банан|картош|картоф|(^|\s)рис|макарон|чай|кофе|сахар|масл|кефир|йогурт|колбас|рыб|продукт|магазин|пятероч|магнит|перекрест|вкусвилл|ашан|лент[аеу]|шоколад|печень|(^|\s)вод[аыу](?![а-я])/],

  'Транспорт': ['#2f74d0', 'M5 16l1.5-6A2 2 0 0 1 8.4 8.5h7.2A2 2 0 0 1 17.5 10L19 16v3H5zM5 16h14M8 19v1M16 19v1'], 'Дом': ['#7a6bd6', 'M4 11l8-7 8 7M6 9.5V20h12V9.5'],
  'Здоровье': ['#d6455d', 'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.500-7 10-7 10z'], 'Одежда': ['#3aa6b9', 'M9 4 4 7l2 4 2-1v10h8V10l2 1 2-4-5-3a3 3 0 0 1-6 0z'],
  'Развлечения': ['#c34ea0', 'M5 6h14v12H5zM10 9.500l5 2.500-5 2.500z'], 'Подарки': ['#d55f3e', 'M4 10h16v4H4zM6 14v6h12v-6M12 10v10M12 10S8 9 8 6.500A2 2 0 0 1 12 6.500 2 2 0 0 1 16 6.500C16 9 12 10 12 10z'],
  'Другое': ['#7b8582', 'M6 12h.01M12 12h.01M18 12h.01'],

const icon = cat => { const [c, p] = ICONS[cat] || ICONS['Другое']; const d = document.createElement('div'); d.className = 'ico'; d.style.background = c; d.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="${cat === 'Другое' ? 3 : 1.9}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${p}"/></svg>`; return d; };
function toast(t, undo) {
  $('toastT').textContent = t; undoFn = undo || null; $('toastU').hidden = !undo; $('toast').hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { $('toast').hidden = true; undoFn = null; }, undo ? 5000 : 3500);
}
$('toastU').addEventListener('click', () => { if (undoFn) undoFn(); $('toast').hidden = true; undoFn = null; });
function save(text) {
  const low = text.trim().toLowerCase().replace(/ё/g, 'е');
  if (SAVE_RE.test(low)) {
    const open = goals.find(g => g.saved < g.target) || goals[0];
    const run = numberRuns(tokenize(low)).pop();
    if (!open) { tab = 'goal'; render(); toast('Сначала создайте цель в копилке'); return true; }
    if (!run || !(run.v > 0)) { toast('Назовите сумму: например, «в копилку 5000»'); return false; }
    deposit(open, run.v); return true;
  }
  const list = parsePhrase(text); if (!list.length) return false;
  const made = list.map(e => ({ ...e, id: rid(), done: false }));
  tab = made[0].kind === 'plan' ? 'plan' : 'spend';
  made.forEach(put);
  const a = made[0];
  const label = made.length > 1 ? `Записано: ${made.length}, на ${fmt(made.reduce((s, e) => s + (e.amount || 0), 0))}` : `${a.title}${a.amount !== null ? ' · ' + fmt(a.amount) : ''} · ${a.kind === 'plan' ? 'в планах' : a.cat}`;
  toast(label, () => made.forEach(e => drop(e.id)));
  return true;
}
$('add').addEventListener('submit', e => { e.preventDefault(); const f = $('say'); if (save(f.value)) f.value = ''; else if (!f.value.trim()) toast('Скажите, что купили: например, «хлеб 60»'); f.focus(); });
document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.t; render(); scrollTo(0, 0); }));
const dayName = t => { const k = dayKey(t), now = Date.now(); if (k === dayKey(now)) return 'Сегодня'; if (k === dayKey(now - 864e5)) return 'Вчера'; return new Date(t).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'short' }); };
function rowBtn(e, sub) {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'row';
  const g = document.createElement('div'); g.className = 'grow'; g.textContent = e.title;
  const s = document.createElement('small'); s.textContent = sub; g.append(s);
  const none = e.amount === null || e.amount === undefined;
  const a = document.createElement('div'); a.className = 'amt' + (none ? ' none' : ''); a.textContent = none ? (e.kind === 'plan' ? '' : 'сумма?') : fmt(e.amount);
  if (e.kind === 'spend') b.append(icon(e.cat));
  b.append(g, a); b.addEventListener('click', () => openEdit(e)); return b;
}
function emptyState(h, ex, lead) { const d = document.createElement('div'); d.className = 'empty'; const b = document.createElement('b'); b.textContent = h; d.append(b); if (lead) d.append(lead); ex.forEach(x => { const c = document.createElement('span'); c.textContent = x; d.append(c); }); return d; }
function sec(left, right) { const h = document.createElement('div'); h.className = 'sec'; const n = document.createElement('span'); n.textContent = left; h.append(n); if (right) { const b = document.createElement('b'); b.textContent = right; h.append(b); } return h; }
function renderHero(month, sum, now) {
  $('totalN').textContent = fmt(sum);
  $('monthName').textContent = 'Потрачено за ' + now.toLocaleDateString('ru-RU', { month: 'long' });
  const day = now.getDate(), last = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  $('heroSub').textContent = sum ? `В среднем ${fmt(Math.round(sum / day))} в день` : `Осталось дней в месяце: ${last - day}`;
  const open = goals.find(g => g.saved < g.target) || goals[0];
  $('heroGoal').hidden = !open || tab === 'goal';
  if (open) { $('heroImg').src = `img/${ART[open.art] ? open.art : 'house'}.jpg`; $('heroTitle').textContent = open.title; $('heroPct').textContent = Math.floor(Math.min(1, open.saved / open.target) * 100) + '%'; }
  const w = $('week'); w.replaceChildren();
  const vals = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(now); d.setDate(d.getDate() - i); const k = dayKey(d.getTime()); vals.push({ d, v: entries.filter(e => e.kind === 'spend' && dayKey(e.ts) === k).reduce((s, e) => s + (e.amount || 0), 0) }); }
  const max = Math.max(1, ...vals.map(x => x.v));
  vals.forEach((x, i) => { const c = document.createElement('div'); if (i === 6) c.className = 'now'; const b = document.createElement('i'); b.style.height = Math.max(5, x.v / max * 72) + '%'; const l = document.createElement('span'); l.textContent = x.d.toLocaleDateString('ru-RU', { weekday: 'narrow' }).toUpperCase(); c.append(b, l); w.append(c); });
}
function render() {
  // Не сбрасываем сумму, пока её вводят в карточке цели.
  if (document.activeElement && document.activeElement.matches && document.activeElement.matches('#list input')) return;
  const now = new Date(), month = entries.filter(e => e.kind === 'spend' && new Date(e.ts).getMonth() === now.getMonth() && new Date(e.ts).getFullYear() === now.getFullYear());
  const sum = month.reduce((s, e) => s + (e.amount || 0), 0);
  renderHero(month, sum, now);
  $('tip').hidden = entries.length > 2;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.t === tab));
  const L = $('list'); L.replaceChildren();
  if (tab === 'spend') {
    const all = entries.filter(e => e.kind === 'spend').sort((a, b) => b.ts - a.ts);
    if (!all.length) { L.append(emptyState('Трат пока нет', ['хлеб 60', 'такси триста пятьдесят', 'молоко 120, сыр 400', 'вчера бензин 2000'])); return; }
    const days = new Map(); all.forEach(e => { const k = dayKey(e.ts); if (!days.has(k)) days.set(k, []); days.get(k).push(e); });
    days.forEach(list => {
      const w = document.createElement('div');
      w.append(sec(dayName(list[0].ts), fmt(list.reduce((s, e) => s + (e.amount || 0), 0))));
      const g = document.createElement('div'); g.className = 'group'; list.forEach(e => g.append(rowBtn(e, e.cat))); w.append(g); L.append(w);
    });
  } else if (tab === 'plan') {
    const all = entries.filter(e => e.kind === 'plan').sort((a, b) => a.ts - b.ts);
    if (!all.length) { L.append(emptyState('Планов пока нет', ['план шины 15000', 'надо купить куртку 8000', 'план записаться к врачу'])); return; }
    const w = document.createElement('div'); w.append(sec('Всего запланировано', fmt(all.reduce((s, e) => s + (e.amount || 0), 0))));
    const g = document.createElement('div'); g.className = 'group';
    for (const e of all) {
      const r = document.createElement('div'); r.className = 'rowwrap';
      const t = document.createElement('button'); t.type = 'button'; t.className = 'tick'; t.setAttribute('aria-label', 'Выполнено: ' + e.title);
      t.addEventListener('click', () => { const before = { ...e }; if (e.amount === null || e.amount === undefined) { drop(e.id); toast('«' + e.title + '» выполнено', () => put(before)); return; } put({ ...e, kind: 'spend', ts: Date.now() }); toast(e.title + ' перенесено в траты', () => put(before)); });
      r.append(t, rowBtn(e, e.cat)); g.append(r);
    }
    w.append(g); L.append(w);
  } else if (tab === 'goal') {
    const newBtn = document.createElement('button'); newBtn.type = 'button'; newBtn.className = 'ghost'; newBtn.textContent = goals.length ? 'Новая цель' : 'Создать первую цель'; newBtn.addEventListener('click', () => openGoal(null));
    if (!goals.length) {
      const d = emptyState('Копите и стройте', ['в копилку 5000']);
      const svg = document.createElement('div'); svg.className = 'photo'; svg.style.marginBottom = '12px'; svg.innerHTML = photoSvg('moto', 4, 4, 'demo'); svg.firstChild.setAttribute('aria-label', 'Пример: мотоцикл, собранный наполовину'); svg.firstChild.style.display = 'block'; svg.firstChild.style.width = '100%'; svg.firstChild.style.height = 'auto';
      d.insertBefore(svg, d.children[1]);
      const txt = document.createElement('div'); txt.textContent = 'Выберите дом, квартиру, Audi A7 или мотоцикл. С каждым взносом на фото оживает новая часть. Пополнять можно голосом:'; txt.style.marginBottom = '4px'; d.insertBefore(txt, d.children[2]);
      L.append(d, newBtn); return;
    }
    goals.forEach(g => L.append(goalCard(g)));
    L.append(newBtn);
    const m = document.createElement('div'); m.className = 'mini';
    const c = document.createElement('button'); c.type = 'button'; c.textContent = 'Скопировать копию'; c.addEventListener('click', copyBackup);
    const r = document.createElement('button'); r.type = 'button'; r.textContent = 'Восстановить из копии'; r.addEventListener('click', () => { $('rText').value = ''; $('rSheet').hidden = false; });
    m.append(c, r); L.append(m);
    const note = document.createElement('div'); note.id = 'tip'; note.textContent = (window.claude ? 'Копилка хранится' : 'Все записи хранятся') + ' только на этом телефоне. Очистка данных Safari или удаление значка их сотрёт, поэтому время от времени сохраняйте копию в Заметки.'; note.style.padding = '0 6px'; L.append(note);
  } else {

    const by = {}; month.forEach(e => by[e.cat] = (by[e.cat] || 0) + (e.amount || 0));
    const sorted = Object.entries(by).sort((a, b) => b[1] - a[1]), max = sorted[0][1] || 1;
    const w = document.createElement('div'); w.append(sec('По категориям'));
    const g = document.createElement('div'); g.className = 'group';
    for (const [c, v] of sorted) {
      const r = document.createElement('div'); r.className = 'cat';
      const body = document.createElement('div'); body.style.minWidth = '0';
      const line = document.createElement('div'); line.className = 'line';
      const a = document.createElement('span'); a.textContent = c; const sm = document.createElement('small'); sm.textContent = Math.round(v / (sum || 1) * 100) + '%'; a.append(sm);
      const b = document.createElement('span'); b.className = 'amt'; b.textContent = fmt(v); line.append(a, b);
      const bar = document.createElement('div'); bar.className = 'bar'; bar.style.marginTop = '6px'; const i = document.createElement('i'); i.style.width = (v / max * 100) + '%'; i.style.background = (ICONS[c] || ICONS['Другое'])[0]; bar.append(i);
      body.append(line, bar); r.append(icon(c), body); g.append(r);
    }
    w.append(g); L.append(w);
  }
}
CAT_NAMES.forEach(n => { const o = document.createElement('option'); o.value = o.textContent = n; $('fCat').append(o); });
function openEdit(e) { editing = e; $('fTitle').value = e.title; $('fAmt').value = e.amount ?? ''; $('fCat').value = e.cat; $('fKind').value = e.kind; $('sheet').hidden = false; }
const closeEdit = () => { $('sheet').hidden = true; editing = null; };
$('fCancel').addEventListener('click', closeEdit);

$('fDel').addEventListener('click', () => { const b = { ...editing }; drop(b.id); closeEdit(); toast('«' + b.title + '» удалено', () => put(b)); });
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const a = $('fAmt').value.trim();
  put({ ...editing, title: $('fTitle').value.trim() || editing.title, amount: a === '' ? null : parseFloat(a.replace(',', '.')), cat: $('fCat').value, kind: $('fKind').value });
  closeEdit();
});

// Голос прямо со страницы там, где браузер это разрешает. Иначе работает микрофон клавиатуры.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const mic = $('mic'); mic.hidden = false; let rec = null;
  mic.addEventListener('click', () => {
    if (rec) { rec.stop(); return; }
    try {
      rec = new SR(); rec.lang = 'ru-RU'; rec.interimResults = true; rec.continuous = false;
      mic.classList.add('on');
      rec.onresult = e => { const r = e.results[e.results.length - 1]; $('say').value = r[0].transcript; if (r.isFinal && save(r[0].transcript)) $('say').value = ''; };
      rec.onerror = () => { mic.hidden = true; $('say').focus(); toast('Здесь голос через кнопку не работает. Используйте микрофон на клавиатуре.'); };
      rec.onend = () => { mic.classList.remove('on'); rec = null; };
      rec.start();
    } catch { mic.hidden = true; $('say').focus(); }
  });
}
boot();
// В автономной версии приложение открывается и без интернета.
if (!window.claude && location.protocol === 'https:' && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
